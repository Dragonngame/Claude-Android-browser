name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack project.zip
        run: |
          if [ -f project.zip ]; then unzip -o project.zip -d . ; fi
          ls -la

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Check APK contents
        run: unzip -l app/build/outputs/apk/debug/app-debug.apk | grep -E "\.so$" || true

      - name: Publish APK as a release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Remote Browser build ${{ github.run_number }}
          files: app/build/outputs/apk/debug/app-debug.apk
